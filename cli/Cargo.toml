[package]
name = "joule-profiler-cli"
version = "3.0.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI tool to measure program energy consumption"
keywords = ["energy", "profiling", "cli"]
readme = "../README.md"

[[bin]]
name = "joule-profiler"
path = "src/bin/main.rs"

[dependencies]
joule-profiler-config = { path = "../config", version = "0.1.0", default-features = false, features = ["clap"] }
joule-profiler-core.workspace = true
joule-profiler-injector-stdout = { path = "../injectors/stdout", version = "0.1.0" }
joule-profiler-exporter-terminal = { path = "../exporters/terminal", version = "0.1.0" }
joule-profiler-exporter-json = { path = "../exporters/json", version = "0.1.0" }
joule-profiler-exporter-csv = { path = "../exporters/csv", version = "0.1.0" }
log.workspace = true
serde.workspace = true

anyhow = "1.0.100"
env_logger = "0.11.8"
clap = { version = "4.5.53", features = ["derive"] }

[dev-dependencies]
serde_json.workspace = true

[features]
default = ["config-toml", "config-json", "rapl-perf", "rapl-powercap", "perf_event", "nvml", "amdsmi", "procfs", "cgroup"]

config-toml = ["joule-profiler-config/toml"]
config-json = ["joule-profiler-config/json"]

rapl-perf = ["joule-profiler-config/rapl-perf"]
rapl-powercap = ["joule-profiler-config/rapl-powercap"]

perf_event = ["joule-profiler-config/perf_event"]
perf = ["perf_event"]

nvml = ["joule-profiler-config/nvml"]
amdsmi = ["joule-profiler-config/amdsmi"]
procfs = ["joule-profiler-config/procfs"]
cgroup = ["joule-profiler-config/cgroup"]

[lints]
workspace = true
