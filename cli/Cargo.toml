[package]
name = "joule-profiler-cli"
version = "3.0.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI tool to measure program energy consumption"
keywords = ["energy", "profiling", "rapl", "nvml", "cli"]
readme = "../README.md"

[[bin]]
name = "joule-profiler"
path = "src/bin/main.rs"

[dependencies]
joule-profiler-source-rapl = { path = "../sources/rapl", version = "1.0.5", default-features = false, optional = true }
joule-profiler-source-perf_event = { path = "../sources/perf_event", version = "1.0.2", optional = true }
joule-profiler-source-nvml = { path = "../sources/nvml", version = "1.0.2", optional = true }
joule-profiler-source-amdsmi = { path = "../sources/amdsmi", version = "0.1.0", optional = true }
joule-profiler-source-procfs = { path = "../sources/procfs", version = "0.1.0", optional = true }
joule-profiler-source-cgroup = { path = "../sources/cgroup", version = "0.1.0", optional = true }

joule-profiler-core.workspace = true
log.workspace = true
thiserror.workspace = true
tokio.workspace = true
serde.workspace = true
humantime-serde.workspace = true

anyhow = "1.0.100"
env_logger = "0.11.8"
clap = { version = "4.5.53", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
toml = "1.1.2"
humantime = "2.3.0"
csv = "1.4.0"

[dev-dependencies]
tempfile.workspace = true

[features]
default = ["rapl-perf", "rapl-powercap", "perf_event", "nvml", "amdsmi", "procfs", "cgroup"]

rapl = ["dep:joule-profiler-source-rapl"]
_rapl = ["rapl"]
rapl-perf = ["_rapl", "joule-profiler-source-rapl/backend-perf"]
rapl-powercap = ["_rapl", "joule-profiler-source-rapl/backend-powercap"]

perf_event = ["dep:joule-profiler-source-perf_event"]
perf = ["perf_event"]

nvml = ["dep:joule-profiler-source-nvml"]
amdsmi = ["dep:joule-profiler-source-amdsmi"]
procfs = ["dep:joule-profiler-source-procfs"]
cgroup = ["dep:joule-profiler-source-cgroup"]

[lints]
workspace = true
