# Example configuration of Joule Profiler.
#
# Usage:
#   joule-profiler --config examples/example_config.toml profile -- ./my-program
#
# Any key below can be overridden on the command line with its dotted path,
# with or without this file:
#   joule-profiler --config examples/example_config.toml \
#     -D exporter.lines=false -D sources.procfs.global=true profile -- ...
#
# A flag outranks both: `--output-format` and `--output-file` replace
# `exporter.format` and `exporter.file`. Picking another format than the
# file's drops the rest of `[exporter]`, whose keys belong to its format.
#
# Each `[sources.<name>]` table turns that source on, as `--sources` does.
# `ignore_on_failure = true` leaves the source out, with a warning, when it
# cannot be built instead of stopping the run.
#
# Notes: all keys are optional and Joule Profiler does not require a
# configuration file, the CLI can be used alone. This example writes the
# results to results.jsonl and the output of the program to stdout.txt.

[profiler]
# Processes and exports the phases only once the run is over.
defer = false

# `format` picks the exporter, the other keys are its own options:
#   terminal: none, the results are printed as the run goes
#   json:     file, lines
#   csv:      file
[exporter]
format = "json"          # terminal | json | csv
file = "results.jsonl"   # default: data<timestamp>.<json|jsonl|csv>
lines = true             # one object per line as the run goes, instead of one document at the end (only for json)

[injector]
# Detects the phase tokens on the standard output of the program.
token_pattern = "__[A-Z0-9_]+__"
# Where the output of the program goes, instead of the terminal.
stdout_file = "stdout.txt"
# Under `sudo`, runs the program as root instead of as the user who called sudo.
use_root = false

# The cgroup made for the run, which the program is moved into. Without this
# table, one is made only for a `cgroup` source that names no cgroup.
# Making it needs root or a delegated subtree, and its failure stops the run.
#[cgroup]
#parent = "/sys/fs/cgroup"
#name = "joule-profiler-run"     # default: joule-profiler-<pid>
#controllers = ["cpu", "memory", "io"] # the default
#attach = true                   # moves the program into it
#freeze = false                  # frozen before the program starts, thawed once the sources are ready

# RAPL
[sources.rapl]
ignore_on_failure = true
backend = "perf"                 # perf | powercap
unit = "microjoule"              # joule | millijoule | microjoule
sockets = [0]                    # omit for every socket
domains = ["package", "core", "uncore", "dram", "psys"] # omit for every domain found
# With `backend = "powercap"`:
#root = "/sys/class/powercap"
#poll_interval = "1s"            # how often the counters are read, so that no wrap is missed

# perf_event, on the process tree of the program.
[sources.perf_event]
ignore_on_failure = true
scope = "pid"                    # pid | cgroup
events = ["cpu_cycles", "instructions", "cache_misses", "branch_misses"]
# With `scope = "cgroup"`, on a cgroup instead:
#name = "my.slice"              # relative to `root`, required
#root = "/sys/fs/cgroup"
#cpus = [0, 1]                  # omit for every online CPU

# procfs
[sources.procfs]
ignore_on_failure = true
poll_interval = "10ms"           # the memory of the machine, when `global`
process_poll_interval = "20ms"   # the memory of the process tree
hierarchy_poll_interval = "1s"   # how often the process tree is listed again
global = false                   # also reports the memory and CPU time of the machine

# cgroup v2. It measures the cgroup made for the run unless it names one, so
# it needs the rights the `[cgroup]` table describes.
#[sources.cgroup]
#ignore_on_failure = true
#name = "my.slice"              # omit to measure the cgroup made for the run
#root = "/sys/fs/cgroup"
#poll_interval = "10ms"
#global = false                 # also reports the whole hierarchy

# NVML
[sources.nvml]
ignore_on_failure = true
gpus = [0]                       # device indices, omit for every GPU
minimal = true                   # energy only, without VRAM and utilization
poll_interval = "20ms"

# AMD SMI
[sources.amdsmi]
ignore_on_failure = true
gpus = ["GPU-00000000-0000-0000-0000-000000000000"] # device UUIDs, omit for every GPU
minimal = true                   # energy only, without VRAM and utilization
poll_interval = "20ms"
